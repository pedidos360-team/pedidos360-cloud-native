server.port=8082
spring.application.name=servicio-pedido

# Base local temporal; reemplazar por RDS/Aurora en la nube.
spring.datasource.url=${ORDER_DB_URL:jdbc:h2:mem:pedidodb}
spring.datasource.driverClassName=${ORDER_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${ORDER_DB_USERNAME:sa}
spring.datasource.password=${ORDER_DB_PASSWORD:}
spring.jpa.database-platform=${ORDER_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Microsoft Entra ID / Resource Server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MS_ENTRA_ISSUER_URI:https://login.microsoftonline.com/f526ccbd-b7aa-4640-a83e-9c33ff4bc07e/v2.0}
app.security.audience=${MS_ENTRA_AUDIENCE:api://ed614ce8-0c2e-4a39-b0c0-546b14f540df}
# Déjalo vacío para exigir solo audience en local; configura access_as_user (o el scope real) en cloud.
app.security.required-scope=${MS_ENTRA_REQUIRED_SCOPE:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
