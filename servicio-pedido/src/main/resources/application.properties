server.port=8082
spring.application.name=servicio-pedido

# PostgreSQL local (docker-compose). Sobreescribible por variable de entorno.
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
spring.datasource.driverClassName=${ORDER_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${ORDER_DB_USERNAME:pedidos360}
spring.datasource.password=${ORDER_DB_PASSWORD:pedidos360}
spring.jpa.database-platform=${ORDER_DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${ORDER_DB_DDL_AUTO:update}

# RabbitMQ (docker-compose local, clúster de 2 nodos)
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Nombres centralizados de colas, exchanges y bindings
rabbitmq.exchange.pedidos=pedidos.events.exchange
rabbitmq.exchange.dlx=pedidos360.dlx.exchange
rabbitmq.queue.notifications=notifications.queue
rabbitmq.queue.ticket-generation=ticket-generation.queue
rabbitmq.queue.dlq=pedidos360.dlq

# Kafka (docker-compose local, clúster de 2 brokers)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pedidos360.servicio_pedido.kafka
spring.kafka.consumer.group-id=servicio-pedido-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Alias de tipo para los eventos: desacopla el nombre de clase Java de cada servicio
# (cada uno tiene su propia copia local del DTO), solo se serializa el alias en el header.
spring.kafka.producer.properties.spring.json.type.mapping=pedidoTrackingEvent:com.pedidos360.servicio_pedido.kafka.PedidoTrackingEvent,stockEvent:com.pedidos360.servicio_pedido.kafka.StockEvent
spring.kafka.consumer.properties.spring.json.type.mapping=pedidoTrackingEvent:com.pedidos360.servicio_pedido.kafka.PedidoTrackingEvent,stockEvent:com.pedidos360.servicio_pedido.kafka.StockEvent

# Nombres centralizados de tópicos Kafka
kafka.topic.pedidos-tracking=pedidos.tracking-eventos
kafka.topic.productos-stock=productos.stock-eventos

# Microsoft Entra ID / Resource Server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MS_ENTRA_ISSUER_URI:https://login.microsoftonline.com/cb565889-45aa-446c-b565-301e6a79000f/v2.0}
# En tokens v2.0 de Entra, aud suele ser el client ID GUID de la API.
app.security.audience=${MS_ENTRA_AUDIENCE:c6f45fc0-a444-4879-8ddb-70b6cee9ecc5}
# Déjalo vacío para exigir solo audience en local; configura access_as_user (o el scope real) en cloud.
app.security.required-scope=${MS_ENTRA_REQUIRED_SCOPE:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
