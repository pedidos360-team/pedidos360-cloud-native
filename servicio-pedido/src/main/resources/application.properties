server.port=8082
spring.application.name=servicio-pedido

# PostgreSQL local (docker-compose). Sobreescribible por variable de entorno.
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
spring.datasource.driverClassName=${ORDER_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${ORDER_DB_USERNAME:pedidos360}
spring.datasource.password=${ORDER_DB_PASSWORD:pedidos360}
spring.jpa.database-platform=${ORDER_DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${ORDER_DB_DDL_AUTO:update}

# RabbitMQ (docker-compose local)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Nombres centralizados de colas, exchanges y bindings
rabbitmq.exchange.pedidos=pedidos.events.exchange
rabbitmq.exchange.dlx=pedidos360.dlx.exchange
rabbitmq.queue.notifications=notifications.queue
rabbitmq.queue.ticket-generation=ticket-generation.queue
rabbitmq.queue.dlq=pedidos360.dlq

# Microsoft Entra ID / Resource Server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MS_ENTRA_ISSUER_URI:https://login.microsoftonline.com/f526ccbd-b7aa-4640-a83e-9c33ff4bc07e/v2.0}
# En tokens v2.0 de Entra, aud suele ser el client ID GUID de la API.
app.security.audience=${MS_ENTRA_AUDIENCE:ed614ce8-0c2e-4a39-b0c0-546b14f540df}
# Déjalo vacío para exigir solo audience en local; configura access_as_user (o el scope real) en cloud.
app.security.required-scope=${MS_ENTRA_REQUIRED_SCOPE:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
