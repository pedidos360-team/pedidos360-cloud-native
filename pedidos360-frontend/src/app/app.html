<div class="container card">
  <h1>Pedidos360 - Portal de Control</h1>
  <p>Sistema de gestión e integración con Microsoft Entra ID.</p>
  <hr>

  <div *ngIf="!isLoggedIn()">
    <p>Por favor, inicia sesión para acceder al sistema:</p>
    <button (click)="login()" class="btn btn-primary">
      Iniciar sesión con Microsoft
    </button>
  </div>

  <div *ngIf="isLoggedIn()">
    <p class="success-text">✓ Sesión iniciada correctamente</p>
    <button (click)="logout()" class="btn btn-secondary">
      Cerrar sesión
    </button>
  </div>
</div>
