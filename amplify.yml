version: 1
applications:
  - appRoot: pedidos360-frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist/pedidos360-frontend/browser
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*