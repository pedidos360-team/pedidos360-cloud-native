server.port=8081
spring.application.name=servicio-producto

# RDS PostgreSQL (pedidos360-db). Reemplazar el host una vez que la instancia esté "Available".
spring.datasource.url=${PRODUCT_DB_URL:jdbc:postgresql://pedidos360-db.c2c2nmznee7t.us-east-1.rds.amazonaws.com:5432/pedidos360}
spring.datasource.driverClassName=${PRODUCT_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${PRODUCT_DB_USERNAME:pedidos360admin}
spring.datasource.password=${PRODUCT_DB_PASSWORD:}
spring.jpa.database-platform=${PRODUCT_DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${PRODUCT_DB_DDL_AUTO:update}

# Microsoft Entra ID / Resource Server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MS_ENTRA_ISSUER_URI:https://login.microsoftonline.com/f526ccbd-b7aa-4640-a83e-9c33ff4bc07e/v2.0}
# En tokens v2.0 de Entra, aud suele ser el client ID GUID de la API.
app.security.audience=${MS_ENTRA_AUDIENCE:ed614ce8-0c2e-4a39-b0c0-546b14f540df}
# Déjalo vacío para exigir solo audience en local; configura access_as_user (o el scope real) en cloud.
app.security.required-scope=${MS_ENTRA_REQUIRED_SCOPE:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
